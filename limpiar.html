<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Toscana House · Actualizar</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F5F2EE;font-family:-apple-system,"Segoe UI",Helvetica,sans-serif;color:#1A1714}
  .card{background:#fff;border:1px solid #E2DED6;border-radius:20px;padding:36px 40px;
    max-width:400px;text-align:center;box-shadow:0 10px 30px -12px rgba(20,19,24,.15)}
  .th{font-family:Georgia,serif;font-size:28px;letter-spacing:.14em;margin-bottom:6px}
  .sub{font-size:10px;letter-spacing:.24em;color:#A8A29E;text-transform:uppercase;margin-bottom:24px}
  #msg{font-size:15px;line-height:1.6;color:#57534E}
  .ok{color:#166534;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="th">T H</div>
  <div class="sub">Toscana House</div>
  <div id="msg">Actualizando la aplicación…<br/>No cierres esta ventana.</div>
</div>
<script>
(async function(){
  const msg = document.getElementById("msg");
  try{
    if("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const r of regs){ await r.unregister(); }
    }
    if(window.caches){
      const keys = await caches.keys();
      for(const k of keys){ await caches.delete(k); }
    }
    msg.innerHTML = '<span class="ok">Listo, aplicación actualizada.</span><br/>Abriendo la versión nueva…';
  }catch(e){
    msg.innerHTML = 'Hubo un detalle, pero igual vamos a recargar…';
  }
  setTimeout(function(){ window.location.replace("/?actualizado=" + Date.now()); }, 1200);
})();
</script>
</body>
</html>
